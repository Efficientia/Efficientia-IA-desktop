<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinttia | Assessor IA</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Adicionando Marked.js para suporte a Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-info">
                <h1>Cinttia</h1>
                <p>Seu assessor inteligente</p>
            </div>
            <div class="header-actions">
                <a class="btn-sre-info" href="/static/sre.html" title="Como funciona o SRE e os custos">Como funciona o SRE</a>
                <button type="button" class="btn-observabilidade" onclick="window.open('/monitor', '_blank')" title="Abrir Painel de Observabilidade SRE & FinOps">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    <span>Observabilidade</span>
                </button>
            </div>
        </header>

        <div id="chat" class="chat-messages">
            <div class="message bot">
                Olá! Como posso ajudar você hoje?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite sua pergunta...">
            <button onclick="enviar()">Enviar</button>
        </div>
        <div id="loader" class="loader" style="display: none;">
            <div class="spinner"></div> <span>Pensando...</span>
        </div>
    </div>

    <!-- Botão Flutuante de Acesso Rápido ao Painel SRE & FinOps -->
    <a href="/monitor" target="_blank" class="floating-monitor-btn" title="Acessar Painel SRE & FinOps em tempo real">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Painel SRE / FinOps</span>
    </a>
    <script src="/static/script.js"></script>
</body>
</html>
