<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinttia | Assessor IA</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Adicionando Marked.js para suporte a Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>Cinttia</h1>
            <p>Seu assessor inteligente</p>
        </header>

        <div id="chat" class="chat-messages">
            <div class="message bot">
                Olá! Como posso ajudar você hoje?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite sua pergunta...">
            <button onclick="enviar()">Enviar</button>
        </div>
        <div id="loader" class="loader" style="display: none;">
            <div class="spinner"></div> <span>Pensando...</span>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
